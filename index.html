<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Querida Anthonella</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f5f0eb; /* Fondo beige cálido */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a4238;
    }

    /* Tarjeta principal */
    .card {
      background-color: #fffcf8; /* Beige suave */
      width: 90%;
      max-width: 380px;
      height: 580px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      text-align: center;
    }

    /* Botones de audio en la esquina superior derecha */
    .audio-controls {
      position: absolute;
      top: 18px;
      right: 18px;
      display: flex;
      gap: 8px;
    }

    .audio-btn {
      background-color: #e8ded2;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      font-size: 14px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .audio-btn:active {
      transform: scale(0.95);
    }

    .audio-btn:hover {
      background-color: #dcd0c0;
    }

    /* Contenido de la portada */
    .content {
      margin-top: auto;
      margin-bottom: auto;
    }

    h1 {
      font-size: 26px;
      letter-spacing: 2px;
      font-weight: 800;
      color: #2c251e;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    p.subtitle {
      font-size: 13px;
      letter-spacing: 1.5px;
      color: #8c7e6d;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .heart-icon {
      font-size: 55px;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Botones de navegación */
    .nav-buttons {
      width: 100%;
      display: flex;
      justify-content: space-between;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-disabled {
      background-color: #e0d8cf;
      color: #a89d90;
      cursor: not-allowed;
    }

    .btn-next {
      background-color: #dfaba2;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(223, 171, 162, 0.4);
    }
  </style>
</head>
<body>

  <!-- Audio vinculado con Vocaroo -->
  <audio id="bgAudio" loop preload="auto">
    <source src="https://media.vocaroo.com/mp3/105P8yqPVFBU" type="audio/mpeg">
  </audio>

  <div class="card">
    
    <!-- Controles de Audio -->
    <div class="audio-controls">
      <button class="audio-btn" onclick="playAudio()" title="Reproducir audio">▶️</button>
      <button class="audio-btn" onclick="pauseAudio()" title="Pausar audio">⏸️</button>
    </div>

    <!-- Contenido -->
    <div class="content">
      <h1>QUERIDA<br>ANTHONELLA</h1>
      <p class="subtitle">CÓMO ME ENAMORÉ DE VOS...</p>
      
      <!-- Corazón azul celeste -->
      <div class="heart-icon">🩵</div>
    </div>

    <!-- Navegación -->
    <div class="nav-buttons">
      <button class="btn btn-disabled" disabled>Anterior</button>
      <button class="btn btn-next">Siguiente</button>
    </div>

  </div>

  <script>
    const audio = document.getElementById('bgAudio');

    function playAudio() {
      audio.play().catch(error => {
        console.log("Error al reproducir audio:", error);
      });
    }

    function pauseAudio() {
      audio.pause();
    }
  </script>

</body>
</html>
